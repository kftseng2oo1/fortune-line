name = "fortune-line"
main = "src/index.js"
compatibility_date = "2026-10-01"
preview_urls = false   # 不需要每個版本的預覽網址

# 每日命盤運勢 LINE Bot ── 階段一（免費版 MVP）・紫微斗數（z1 引擎）
# 部署前請依 README 建立 KV、填入 LIFF_ID 等設定，並用 wrangler secret 設定機密值。

[[kv_namespaces]]
binding = "FORTUNE_KV"
id = "bcb1500c2cf04fc5937813ae1206ad70"

# 經 Service Binding 呼叫 arcar（同帳號 Worker 互叫用這個最穩）
# service 名稱要和 Cloudflare 後台的 arcar Worker 名稱一致
[[services]]
binding = "ARCAR"
service = "arcar"

# 🪔 阿拉燈的典籍檢索（/rag/query）在 twinklehub Worker；service 名稱要和後台 twinklehub Worker 名稱一致
[[services]]
binding = "TWINKLE"
service = "twinklehub"

[vars]
LIFF_ID = "2012141348-mz11FXRB"
LINE_LOGIN_CHANNEL_ID = "2012141348"  # LIFF 所屬 LINE Login channel（fortuneline）的 Channel ID
ALLOWED_ORIGINS = "https://kftseng2oo1.github.io"
PRIVACY_URL = "https://kftseng2oo1.github.io/fortune-line/privacy.html"
ZIWEI_APP_URL = "https://kftseng2oo1.github.io/z1/"
WORKER_URL = "https://fortune-line.kftseng2oo1.workers.dev"   # 雷達圖 PNG 的公開網址前綴
ASTRO_APP_URL = "https://kftseng2oo1.github.io/astro/"
TAROT_APP_URL = "https://kftseng2oo1.github.io/tarot/"
TAROT_IMG_BASE = "https://kftseng2oo1.github.io/fortune-line/tarot-cards/"   # 1910 原版牌面圖（公有領域）
AI_MODEL = "claude-haiku-5-5"
LAMP_MODEL = "claude-haiku-5-5"   # 阿拉燈用的模型；LINE 的 reply token 有時效，用快的模型比較穩
BUDDHA_APP_URL = "https://kftseng2oo1.github.io/buddha/"   # 「問其他上師」按鈕開的阿拉燈 App
LAMP_DAILY_LIMIT = "10"           # 每人每天可問阿拉燈幾次（偵測到危機訊號時不受限制）

# 機密值（不寫在這裡）：
#   npx wrangler secret put LINE_CHANNEL_SECRET
#   npx wrangler secret put LINE_CHANNEL_ACCESS_TOKEN
